<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slither Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: system-ui, sans-serif;
      color: #eee;
    }
    #game-container {
      position: relative;
    }
    #score {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 18px;
      font-weight: bold;
      z-index: 2;
      text-shadow: 0 0 4px #000;
    }
    #canvas {
      display: block;
      background: #16213e;
      border: 3px solid #0f3460;
      border-radius: 4px;
    }
    #game-over {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      border-radius: 4px;
      z-index: 3;
    }
    #game-over.show { display: flex; }
    #game-over h2 { margin-bottom: 8px; font-size: 28px; }
    #game-over p { margin-bottom: 16px; opacity: 0.9; }
    #game-over .hint { font-size: 14px; opacity: 0.7; }
    #settings-btn {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      padding: 6px 12px;
      font-size: 14px;
      background: #0f3460;
      color: #eee;
      border: 1px solid #4ecca3;
      border-radius: 4px;
      cursor: pointer;
    }
    #settings-btn:hover { background: #1a4a7a; }
    #menu {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      border-radius: 4px;
      z-index: 4;
    }
    #menu.hide { display: none; }
    #menu h2 { margin-bottom: 24px; font-size: 32px; }
    #menu .row { margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
    #menu label { font-size: 16px; min-width: 80px; }
    #menu input[type="range"] { width: 180px; }
    #menu .value { min-width: 32px; font-weight: bold; color: #4ecca3; }
    #menu button {
      margin-top: 20px;
      padding: 12px 32px;
      font-size: 18px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    #menu button:hover { background: #5ff5c4; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="score">Score: 0</div>
    <button type="button" id="settings-btn">Settings</button>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="menu">
      <h2>Slither</h2>
      <div class="row">
        <label for="speed-slider">Speed</label>
        <input type="range" id="speed-slider" min="4" max="24" value="12">
        <span class="value" id="speed-value">12</span>
      </div>
      <button type="button" id="play-btn">Play</button>
    </div>
    <div id="game-over">
      <h2>Game Over</h2>
      <p id="final-score">Score: 0</p>
      <p class="hint">Press Space or Enter to restart</p>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const gameOverEl = document.getElementById('game-over');
      const finalScoreEl = document.getElementById('final-score');

      const W = canvas.width;
      const H = canvas.height;
      const GRID = 20;
      const SEGMENT_R = 10;
      const FOOD_R = 8;

      const FOOD_COLORS = ['#4ecca3', '#e94560', '#f9a826', '#a855f7', '#3b82f6', '#ec4899', '#22d3ee', '#f97316'];
      const FOOD_SHAPES = ['circle', 'square', 'triangle'];
      const DEFAULT_SNAKE_COLOR = '#4ecca3';
      const SPEED_POTION_DURATION = 5000;
      const SPEED_POTION_MULT = 1.8;

      let speed = 12;
      let baseSpeed = 12;
      let speedBoostUntil = 0;
      let menuOpen = true;
      let gameStarted = false;
      const menuEl = document.getElementById('menu');
      const playBtn = document.getElementById('play-btn');
      const speedSlider = document.getElementById('speed-slider');
      const speedValueEl = document.getElementById('speed-value');
      const settingsBtn = document.getElementById('settings-btn');

      const SCORE_PER_LEVEL = 5;
      const SPEED_PER_LEVEL = 1.5;
      const LEVEL_MAPS = [
        [
          { x: 150, y: 150, width: 80, height: 40 },
          { x: 500, y: 200, width: 60, height: 80 },
          { x: 300, y: 400, width: 100, height: 50 },
          { x: 100, y: 450, width: 70, height: 60 },
          { x: 600, y: 350, width: 50, height: 70 },
        ],
        [
          { x: 150, y: 150, width: 80, height: 40 },
          { x: 500, y: 200, width: 60, height: 80 },
          { x: 300, y: 400, width: 100, height: 50 },
          { x: 100, y: 450, width: 70, height: 60 },
          { x: 600, y: 350, width: 50, height: 70 },
          { x: 350, y: 100, width: 100, height: 40 },
          { x: 250, y: 280, width: 60, height: 80 },
          { x: 550, y: 450, width: 80, height: 50 },
        ],
        [
          { x: 150, y: 150, width: 80, height: 40 },
          { x: 500, y: 200, width: 60, height: 80 },
          { x: 300, y: 400, width: 100, height: 50 },
          { x: 100, y: 450, width: 70, height: 60 },
          { x: 600, y: 350, width: 50, height: 70 },
          { x: 350, y: 100, width: 100, height: 40 },
          { x: 250, y: 280, width: 60, height: 80 },
          { x: 550, y: 450, width: 80, height: 50 },
          { x: 50, y: 250, width: 60, height: 100 },
          { x: 700, y: 250, width: 60, height: 100 },
          { x: 380, y: 280, width: 40, height: 40 },
          { x: 200, y: 500, width: 120, height: 40 },
        ],
        [
          { x: 150, y: 150, width: 80, height: 40 },
          { x: 500, y: 200, width: 60, height: 80 },
          { x: 300, y: 400, width: 100, height: 50 },
          { x: 100, y: 450, width: 70, height: 60 },
          { x: 600, y: 350, width: 50, height: 70 },
          { x: 350, y: 100, width: 100, height: 40 },
          { x: 250, y: 280, width: 60, height: 80 },
          { x: 550, y: 450, width: 80, height: 50 },
          { x: 50, y: 250, width: 60, height: 100 },
          { x: 700, y: 250, width: 60, height: 100 },
          { x: 380, y: 280, width: 40, height: 40 },
          { x: 200, y: 500, width: 120, height: 40 },
          { x: 400, y: 0, width: 80, height: 60 },
          { x: 400, y: 540, width: 80, height: 60 },
          { x: 0, y: 180, width: 80, height: 60 },
          { x: 720, y: 360, width: 80, height: 60 },
        ],
        [
          { x: 150, y: 150, width: 80, height: 40 },
          { x: 500, y: 200, width: 60, height: 80 },
          { x: 300, y: 400, width: 100, height: 50 },
          { x: 100, y: 450, width: 70, height: 60 },
          { x: 600, y: 350, width: 50, height: 70 },
          { x: 350, y: 100, width: 100, height: 40 },
          { x: 250, y: 280, width: 60, height: 80 },
          { x: 550, y: 450, width: 80, height: 50 },
          { x: 50, y: 250, width: 60, height: 100 },
          { x: 700, y: 250, width: 60, height: 100 },
          { x: 380, y: 280, width: 40, height: 40 },
          { x: 200, y: 500, width: 120, height: 40 },
          { x: 400, y: 0, width: 80, height: 60 },
          { x: 400, y: 540, width: 80, height: 60 },
          { x: 0, y: 180, width: 80, height: 60 },
          { x: 720, y: 360, width: 80, height: 60 },
          { x: 180, y: 320, width: 60, height: 60 },
          { x: 560, y: 320, width: 60, height: 60 },
          { x: 320, y: 180, width: 160, height: 30 },
          { x: 320, y: 390, width: 160, height: 30 },
        ],
      ];

      function getLevel() {
        return Math.min(1 + Math.floor(score / SCORE_PER_LEVEL), LEVEL_MAPS.length);
      }

      function getBlocks() {
        return LEVEL_MAPS[Math.min(getLevel() - 1, LEVEL_MAPS.length - 1)];
      }

      let snake = [];
      let direction = { dx: GRID, dy: 0 };
      let nextDirection = { dx: GRID, dy: 0 };
      let food = { x: 0, y: 0, color: '#f9a826', shape: 'circle', type: 'normal' };
      let score = 0;
      let gameOver = false;
      let lastUpdate = 0;
      let grow = 0;
      let nextSegmentColor = DEFAULT_SNAKE_COLOR;
      let levelFlashUntil = 0;
      let levelGraceUntil = 0;
      let lastLevel = 1;

      function reset() {
        const midY = Math.floor(H / 2 / GRID) * GRID;
        snake = [
          { x: 5 * GRID, y: midY, color: DEFAULT_SNAKE_COLOR },
          { x: 4 * GRID, y: midY, color: DEFAULT_SNAKE_COLOR },
          { x: 3 * GRID, y: midY, color: DEFAULT_SNAKE_COLOR },
        ];
        direction = { dx: GRID, dy: 0 };
        nextDirection = { dx: GRID, dy: 0 };
        score = 0;
        gameOver = false;
        grow = 0;
        nextSegmentColor = DEFAULT_SNAKE_COLOR;
        speedBoostUntil = 0;
        levelFlashUntil = 0;
        levelGraceUntil = 0;
        lastLevel = 1;
        spawnFood();
        gameOverEl.classList.remove('show');
        scoreEl.textContent = 'Score: 0  Level: 1';
      }

      function spawnFood() {
        let ok = false;
        let x, y;
        for (let attempt = 0; attempt < 100; attempt++) {
          x = Math.floor(Math.random() * (W / GRID)) * GRID;
          y = Math.floor(Math.random() * (H / GRID)) * GRID;
          if (snake.some(s => s.x === x && s.y === y)) continue;
          if (getBlocks().some(b => rectOverlap(x - FOOD_R, y - FOOD_R, FOOD_R * 2, FOOD_R * 2, b.x, b.y, b.width, b.height))) continue;
          ok = true;
          break;
        }
        food.x = ok ? x : W / 2;
        food.y = ok ? y : H / 2;
        food.color = FOOD_COLORS[Math.floor(Math.random() * FOOD_COLORS.length)];
        food.shape = FOOD_SHAPES[Math.floor(Math.random() * FOOD_SHAPES.length)];
        food.type = Math.random() < 0.2 ? 'speed' : 'normal';
      }

      function rectOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
        return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
      }

      function headHitBlock() {
        if (performance.now() < levelGraceUntil) return false;
        const h = snake[0];
        const hx = h.x - SEGMENT_R;
        const hy = h.y - SEGMENT_R;
        const size = SEGMENT_R * 2;
        return getBlocks().some(b => rectOverlap(hx, hy, size, size, b.x, b.y, b.width, b.height));
      }

      function headHitBody() {
        if (snake.length < 4) return false;
        const h = snake[0];
        for (let i = 3; i < snake.length; i++) {
          const seg = snake[i];
          const dx = h.x - seg.x;
          const dy = h.y - seg.y;
          if (dx * dx + dy * dy < (SEGMENT_R * 2) * (SEGMENT_R * 2)) return true;
        }
        return false;
      }

      function headHitFood() {
        const h = snake[0];
        const dx = h.x - food.x;
        const dy = h.y - food.y;
        return dx * dx + dy * dy < (SEGMENT_R + FOOD_R) * (SEGMENT_R + FOOD_R);
      }

      function update(now) {
        if (menuOpen || gameOver) return;
        const lvl = getLevel();
        if (lvl > lastLevel) {
          levelFlashUntil = now + 1500;
          levelGraceUntil = now + 1500;
          lastLevel = lvl;
        }
        baseSpeed = Math.min(speed + (lvl - 1) * SPEED_PER_LEVEL, 28);
        const currentSpeed = now < speedBoostUntil ? baseSpeed * SPEED_POTION_MULT : baseSpeed;
        const step = 1000 / currentSpeed;
        if (now - lastUpdate < step) return;
        lastUpdate = now;

        direction = { ...nextDirection };

        const head = snake[0];
        let nx = head.x + direction.dx;
        let ny = head.y + direction.dy;
        if (nx < 0) nx = W - GRID;
        if (nx >= W) nx = 0;
        if (ny < 0) ny = H - GRID;
        if (ny >= H) ny = 0;

        const newHeadColor = head.color;
        snake.unshift({ x: nx, y: ny, color: newHeadColor });
        if (grow > 0) {
          snake[snake.length - 1].color = nextSegmentColor;
          grow--;
        } else {
          snake.pop();
        }

        if (headHitBlock() || headHitBody()) {
          gameOver = true;
          finalScoreEl.textContent = 'Score: ' + score + '  Level: ' + getLevel();
          gameOverEl.classList.add('show');
          return;
        }

        if (headHitFood()) {
          if (food.type === 'speed') {
            speedBoostUntil = now + SPEED_POTION_DURATION;
          } else {
            score++;
            grow += 1;
            nextSegmentColor = food.color;
            scoreEl.textContent = 'Score: ' + score + '  Level: ' + getLevel();
          }
          spawnFood();
        }
      }

      function drawFood() {
        ctx.fillStyle = food.color;
        const r = FOOD_R;
        const x = food.x;
        const y = food.y;
        if (food.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        } else if (food.shape === 'square') {
          ctx.fillRect(x - r, y - r, r * 2, r * 2);
        } else {
          ctx.beginPath();
          ctx.moveTo(x, y - r);
          ctx.lineTo(x + r, y + r);
          ctx.lineTo(x - r, y + r);
          ctx.closePath();
          ctx.fill();
        }
        if (food.type === 'speed') {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      function draw() {
        ctx.fillStyle = '#16213e';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#e94560';
        getBlocks().forEach(b => {
          ctx.fillRect(b.x, b.y, b.width, b.height);
        });

        drawFood();

        snake.forEach((seg, i) => {
          ctx.fillStyle = seg.color;
          if (i === 0) {
            ctx.shadowColor = seg.color;
            ctx.shadowBlur = 8;
          }
          ctx.beginPath();
          ctx.arc(seg.x, seg.y, SEGMENT_R, 0, Math.PI * 2);
          ctx.fill();
          if (i === 0) {
            ctx.shadowBlur = 0;
          }
        });

        if (performance.now() < speedBoostUntil) {
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.font = 'bold 14px system-ui';
          ctx.fillText('Speed!', W - 52, 28);
        }

        if (performance.now() < levelFlashUntil) {
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#4ecca3';
          ctx.font = 'bold 48px system-ui';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('Level ' + getLevel() + '!', W / 2, H / 2);
          ctx.textAlign = 'left';
          ctx.textBaseline = 'alphabetic';
        }
      }

      function gameLoop(now) {
        update(now);
        draw();
        requestAnimationFrame(gameLoop);
      }

      document.addEventListener('keydown', function (e) {
        if (gameOver) {
          if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            reset();
          }
          return;
        }
        e.preventDefault();
        if (e.code === 'ArrowUp' || e.code === 'KeyW') {
          if (direction.dy === 0) nextDirection = { dx: 0, dy: -GRID };
        } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
          if (direction.dy === 0) nextDirection = { dx: 0, dy: GRID };
        } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
          if (direction.dx === 0) nextDirection = { dx: -GRID, dy: 0 };
        } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
          if (direction.dx === 0) nextDirection = { dx: GRID, dy: 0 };
        }
      });

      speedSlider.addEventListener('input', function () {
        speed = parseInt(speedSlider.value, 10);
        speedValueEl.textContent = speed;
      });

      playBtn.addEventListener('click', function () {
        menuEl.classList.add('hide');
        menuOpen = false;
        settingsBtn.style.display = 'block';
        if (!gameStarted) {
          reset();
          lastUpdate = performance.now();
          gameStarted = true;
        } else if (gameOver) {
          reset();
        }
      });

      settingsBtn.addEventListener('click', function () {
        menuOpen = true;
        menuEl.classList.remove('hide');
        playBtn.textContent = (gameStarted && !gameOver) ? 'Resume' : 'Play';
      });

      reset();
      lastUpdate = performance.now();
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
